name: Build JARs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric & NeoForge (Minecraft 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build both mod loaders
        run: gradle build --stacktrace --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeyondTheHorizons-1.21.1-Fabric
          path: build/libs/*-fabric.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeyondTheHorizons-1.21.1-NeoForge
          path: build/libs/*-neoforge.jar
          if-no-files-found: error
          retention-days: 14

  bootstrap-wrapper:
    name: Initialize Gradle Wrapper
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Create Gradle wrapper binary
        run: gradle wrapper --gradle-version 9.4.0 --no-daemon

      - name: Commit wrapper binary once
        run: |
          git add gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: include Gradle wrapper binary [skip ci]"
            git push
          fi
