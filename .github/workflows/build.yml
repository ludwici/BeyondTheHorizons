name: Build JARs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric & NeoForge (Minecraft 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both mod loaders
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeyondTheHorizons-1.21.1-Fabric
          path: build/libs/*-fabric.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeyondTheHorizons-1.21.1-NeoForge
          path: build/libs/*-neoforge.jar
          if-no-files-found: error
          retention-days: 14
