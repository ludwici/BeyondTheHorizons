name: Build NeoForge JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge (Minecraft 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge JAR only
        run: ./gradlew neoforgeIncludeJar --stacktrace --no-daemon

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeyondTheHorizons-neoforge-1.21.1
          path: build/libs/BeyondTheHorizons-neoforge-*.jar
          if-no-files-found: error
          retention-days: 1
